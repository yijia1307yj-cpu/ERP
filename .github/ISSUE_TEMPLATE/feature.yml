name: 功能需求
description: 提出一个新功能或改进
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 描述场景，不要直接说方案
      placeholder: 台湾超商订单在批量打单时，店号经常识别错，要手工改。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案（可选）
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 优先级判断
      options:
        - P0 不做就没法用
        - P1 影响效率
        - P2 有了更好
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: 涉及平台/市场
      placeholder: Shopee TW / TikTok TH / Coupang TW / momo
    validations:
      required: false
